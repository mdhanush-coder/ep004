<!doctype html><html><head><meta charset="utf-8"><script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script><style>body{margin:0}#root{position:relative;width:1920px;height:1080px;background:#000;color:#fff;font:22px monospace}pre{white-space:pre-wrap;margin:20px;width:1800px}</style></head><body>
<div id="root" data-composition-id="dbg" data-start="0" data-duration="2" data-width="1920" data-height="1080"><pre id="o">loading</pre></div>
<script>window.__hf=window.__hf||{};window.__hf.buildReady=window.__hf.buildReady||{};
window.__hf.buildReady['d']=(async()=>{let out='';for(const f of ['india','india-detailed']){const t=await (await fetch('hf-assets/maps/'+f+'.json')).json();const k=Object.keys(t.objects);out+=f+' type='+t.type+' objects='+k.join(',')+'\n';for(const kk of k){const g=t.objects[kk].geometries||[];out+='  '+kk+' n='+g.length+' sample='+JSON.stringify(g.slice(0,3).map(x=>x.properties))+'\n';const n=g.map(x=>JSON.stringify(x.properties)).filter(s=>/gujarat/i.test(s));out+='  gujarat: '+n.join(' | ')+'\n';}}document.getElementById('o').textContent=out;})();
window.__timelines={dbg:gsap.timeline({paused:true})};</script></body></html>
